<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ROBO-Z Educational Game Hub</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Sans Thai","Sarabun",Tahoma,sans-serif;background:linear-gradient(135deg,#eff8ff,#ffffff 45%,#eaf4ff);color:#172033;min-height:100vh}
#menu{min-height:100vh;padding:42px 20px 60px}
.hero{max-width:1100px;margin:auto;text-align:center}
.badge{display:inline-block;background:#dbeafe;color:#1d4ed8;padding:8px 18px;border-radius:999px;font-weight:700;margin-bottom:12px}
h1{font-size:clamp(32px,5vw,56px);margin:8px 0;color:#123b78}
.subtitle{font-size:19px;color:#52627a;margin:0 auto 30px;max-width:720px;line-height:1.7}
.games{max-width:1100px;margin:auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}
.game-card{border:0;text-align:left;background:rgba(255,255,255,.96);border-radius:24px;padding:24px;cursor:pointer;box-shadow:0 10px 28px rgba(37,99,235,.12);border:1px solid #dbeafe;transition:.2s;min-height:255px}
.game-card:hover{transform:translateY(-6px);box-shadow:0 18px 38px rgba(37,99,235,.2);border-color:#93c5fd}
.icon{font-size:48px}
.card-num{font-size:13px;font-weight:800;color:#2563eb;margin-top:8px}
.game-card h2{font-size:22px;margin:8px 0;color:#172554}
.game-card p{font-size:15px;line-height:1.65;color:#64748b;min-height:50px}
.play{display:inline-block;margin-top:12px;background:#2563eb;color:white;padding:10px 17px;border-radius:12px;font-weight:800}
.note{max-width:900px;margin:28px auto 0;text-align:center;background:#fff;border:1px solid #dbeafe;border-radius:18px;padding:15px;color:#52627a}
#player{display:none;min-height:100vh;background:#eef6ff}
.topbar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.95);backdrop-filter:blur(10px);border-bottom:1px solid #dbeafe;padding:12px 16px;display:flex;align-items:center;gap:12px}
.back{border:0;background:#123b78;color:#fff;padding:11px 17px;border-radius:12px;font-weight:800;cursor:pointer}
.current{font-weight:800;color:#173b73}
.game-frame{display:none;width:100%;height:calc(100vh - 62px);border:0;background:white}
@media(max-width:600px){#menu{padding:28px 14px 40px}.game-card{min-height:220px}.game-frame{height:calc(100vh - 62px)}}
</style>
</head>

<section id="menu">
  <div class="hero">

      <span class="play">▶ เล่นเกม</span>

      <div class="icon">🚨</div>

    </button></div>

</section>

  <iframe id="frame0" class="game-frame" srcdoc=&quot;&lt;!DOCTYPE html&gt;\n&lt;html lang=\&quot;th\&quot;&gt;\n&lt;head&gt;\n&lt;meta charset=\&quot;UTF-8\&quot;&gt;\n&lt;meta name=\&quot;viewport\&quot; content=\&quot;width=device-width, initial-scale=1.0\&quot;&gt;\n&lt;title&gt;Robot Builder Mission&lt;/title&gt;\n&lt;style&gt;\n*{box-sizing:border-box;font-family:\&quot;Noto Sans Thai\&quot;,\&quot;Tahoma\&quot;,sans-serif}\nbody{margin:0;background:linear-gradient(135deg,#102a43,#2563eb);min-height:100vh;display:flex;align-items:center;justify-content:center}\n.box{width:95%;max-width:900px;background:white;border-radius:25px;padding:30px;box-shadow:0 15px 40px #0005;color:#111}\n.hidden{display:none}\nh1,h2{text-align:center;color:#1d4ed8;line-height:1.5}\n.story{background:#eff6ff;padding:20px;border-radius:15px;font-size:18px;line-height:1.8}\ninput{width:100%;padding:15px;font-size:18px;border-radius:10px;border:2px solid #ccc;margin:15px 0}\nbutton{width:100%;padding:15px;border:0;border-radius:12px;background:#2563eb;color:white;font-size:18px;font-weight:bold;margin:8px 0;cursor:pointer}\n.option{background:#f8fafc;color:#111;border:2px solid #ddd;text-align:left}\n.feedback{padding:15px;border-radius:12px;font-size:18px;line-height:1.7;margin:15px 0}\n.history{background:#f1f5f9;padding:15px;border-radius:12px;font-size:17px;color:#111}\n.history-item{background:white;padding:10px;margin:8px 0;border-left:5px solid #2563eb;border-radius:8px}\n.progress{height:20px;background:#ddd;border-radius:20px;overflow:hidden}\n.bar{height:100%;background:#2563eb;width:0;transition:.4s}\n&lt;/style&gt;\n&lt;/head&gt;\n&lt;body&gt;\n&lt;div class=\&quot;box\&quot;&gt;\n\n&lt;div id=\&quot;start\&quot;&gt;\n&lt;h1&gt;🤖 Robot Builder Mission&lt;br&gt;ภารกิจปลดล็อก ROBO-X&lt;/h1&gt;\n&lt;div class=\&quot;story\&quot;&gt;\nปี ค.ศ. 2045 ศูนย์พัฒนา Robo Lab ต้องการกู้คืนระบบ ROBO-X&lt;br&gt;&lt;br&gt;\nคุณคือวิศวกรหุ่นยนต์ฝึกหัด ต้องผ่านภารกิจความรู้ 10 ด่าน เพื่อปลดล็อกระบบ\n&lt;/div&gt;\n&lt;input id=\&quot;name\&quot; placeholder=\&quot;กรอกชื่อผู้เล่น\&quot;&gt;\n&lt;button onclick=\&quot;startGame()\&quot;&gt;เริ่มภารกิจ 🚀&lt;/button&gt;\n&lt;h2&gt;📜 ประวัติผู้เล่น&lt;/h2&gt;\n&lt;div id=\&quot;history\&quot; class=\&quot;history\&quot;&gt;&lt;/div&gt;\n&lt;/div&gt;\n\n&lt;div id=\&quot;quiz\&quot; class=\&quot;hidden\&quot;&gt;\n&lt;h2 id=\&quot;mission\&quot;&gt;&lt;/h2&gt;\n&lt;div class=\&quot;story\&quot; id=\&quot;scene\&quot;&gt;&lt;/div&gt;\n&lt;p&gt;ความก้าวหน้า &lt;span id=\&quot;count\&quot;&gt;&lt;/span&gt;&lt;/p&gt;\n&lt;div class=\&quot;progress\&quot;&gt;&lt;div id=\&quot;bar\&quot; class=\&quot;bar\&quot;&gt;&lt;/div&gt;&lt;/div&gt;\n&lt;h2 id=\&quot;question\&quot;&gt;&lt;/h2&gt;\n&lt;div id=\&quot;options\&quot;&gt;&lt;/div&gt;\n&lt;div id=\&quot;feedback\&quot; class=\&quot;feedback\&quot;&gt;&lt;/div&gt;\n&lt;h2&gt;คะแนน: &lt;span id=\&quot;score\&quot;&gt;0&lt;/span&gt; / 100&lt;/h2&gt;\n&lt;button id=\&quot;nextBtn\&quot; style=\&quot;display:none\&quot; onclick=\&quot;nextQuestion()\&quot;&gt;ถัดไป ➡️&lt;/button&gt;\n&lt;/div&gt;\n\n&lt;div id=\&quot;result\&quot; class=\&quot;hidden\&quot;&gt;\n&lt;h1&gt;🎉 ภารกิจสำเร็จ&lt;/h1&gt;\n&lt;h2 id=\&quot;summary\&quot;&gt;&lt;/h2&gt;\n&lt;div id=\&quot;finalHistory\&quot; class=\&quot;history\&quot;&gt;&lt;/div&gt;\n&lt;button onclick=\&quot;location.reload()\&quot;&gt;เล่นใหม่&lt;/button&gt;\n&lt;/div&gt;\n\n&lt;/div&gt;\n\n&lt;script&gt;\nfunction formatDate(date,time){\n if(!date) return \&quot;-\&quot;;\n let d = new Date(date);\n if(isNaN(d)) return date;\n let day=String(d.getDate()).padStart(2,\&quot;0\&quot;);\n let month=String(d.getMonth()+1).padStart(2,\&quot;0\&quot;);\n let year=d.getFullYear()+543;\n let result=day+\&quot;/\&quot;+month+\&quot;/\&quot;+year;\n if(time){\n   let t=new Date(time);\n   if(!isNaN(t)){\n     result+=\&quot; เวลา \&quot;+String(t.getHours()).padStart(2,\&quot;0\&quot;)+\&quot;:\&quot;+String(t.getMinutes()).padStart(2,\&quot;0\&quot;)+\&quot; น.\&quot;;\n   }\n }\n return result;\n}\n\nconst WEB_APP_URL=\&quot;https://script.google.com/macros/s/AKfycbzujA5h9_LpnN23gOZy9gSpT1LNLH-gyhvpoYPdDZpwT_25QJ1ShMy6a4zSQBmOlqJtzg/exec\&quot;;\n\nconst questions=[\n[\&quot;เปิดระบบความรู้\&quot;,\&quot;ROBO-X ต้องการรู้ความหมายของหุ่นยนต์\&quot;,\&quot;หุ่นยนต์ (Robot) หมายถึงข้อใดตามแนวคิดของการสร้างและพัฒนาหุ่นยนต์\&quot;,[\&quot;เครื่องจักรที่ทำงานได้เองโดยไม่จำเป็นต้องมีระบบควบคุม\&quot;,\&quot;ระบบหรือเครื่องจักรที่ออกแบบให้ทำงานตามคำสั่งหรือภารกิจที่กำหนด\&quot;,\&quot;อุปกรณ์อิเล็กทรอนิกส์ที่ใช้สำหรับตรวจจับข้อมูลเท่านั้น\&quot;,\&quot;โครงสร้างทางกลที่ใช้สำหรับติดตั้งมอเตอร์และเซนเซอร์\&quot;],1],\n[\&quot;ตรวจสอบชิ้นส่วน\&quot;,\&quot;ตรวจสอบองค์ประกอบของ ROBO-X\&quot;,\&quot;ข้อใดเป็นองค์ประกอบพื้นฐานของหุ่นยนต์\&quot;,[\&quot;โครงสร้าง ระบบตรวจจับ ระบบขับเคลื่อน และโปรแกรม\&quot;,\&quot;สี รูปร่าง น้ำหนัก และขนาดของหุ่นยนต์\&quot;,\&quot;แบตเตอรี่ สายไฟ และกล่องบรรจุอุปกรณ์เท่านั้น\&quot;,\&quot;เครื่องมือซ่อมบำรุงและพื้นที่ปฏิบัติงาน\&quot;],0],\n[\&quot;เลือกประเภทหุ่นยนต์\&quot;,\&quot;ROBO-X ต้องเลือกประเภทหุ่นยนต์สำหรับการเดินทาง\&quot;,\&quot;หุ่นยนต์ที่สามารถเคลื่อนที่จากตำแหน่งหนึ่งไปยังอีกตำแหน่งหนึ่งจัดเป็นประเภทใด\&quot;,[\&quot;หุ่นยนต์สำหรับงานเฉพาะ\&quot;,\&quot;หุ่นยนต์ทำงานตามเงื่อนไข\&quot;,\&quot;หุ่นยนต์เคลื่อนที่\&quot;,\&quot;หุ่นยนต์ระบบควบคุม\&quot;],2],\n[\&quot;เปิดระบบตรวจจับ\&quot;,\&quot;ROBO-X สูญเสียความสามารถในการรับข้อมูล\&quot;,\&quot;หน้าที่หลักของเซนเซอร์ในระบบหุ่นยนต์คืออะไร\&quot;,[\&quot;ทำให้หุ่นยนต์เกิดการเคลื่อนที่\&quot;,\&quot;ตรวจจับหรือรับข้อมูลจากสภาพแวดล้อม\&quot;,\&quot;จ่ายพลังงานให้มอเตอร์และวงจร\&quot;,\&quot;กำหนดลำดับการทำงานของหุ่นยนต์\&quot;],1],\n[\&quot;แก้ระบบสิ่งกีดขวาง\&quot;,\&quot;ROBO-X ต้องหยุดเมื่อพบสิ่งกีดขวาง\&quot;,\&quot;ควรใช้กระบวนการทำงานใด\&quot;,[\&quot;เซนเซอร์ตรวจจับ → ระบบควบคุมประมวลผล → ส่งคำสั่งให้ระบบขับเคลื่อน\&quot;,\&quot;ระบบขับเคลื่อน → โปรแกรม → เซนเซอร์ตรวจจับ\&quot;,\&quot;โปรแกรม → แหล่งจ่ายพลังงาน → โครงสร้าง\&quot;,\&quot;โครงสร้าง → มอเตอร์ → เปลี่ยนโปรแกรม\&quot;],0],\n[\&quot;วิเคราะห์ข้อมูล\&quot;,\&quot;ตรวจสอบข้อมูลจากเซนเซอร์\&quot;,\&quot;ข้อมูลจากเซนเซอร์จัดอยู่ในส่วนใดของระบบ\&quot;,[\&quot;Input\&quot;,\&quot;Process\&quot;,\&quot;Output\&quot;,\&quot;Feedback\&quot;],0],\n[\&quot;วางแผนสร้างหุ่นยนต์\&quot;,\&quot;เริ่มต้นภารกิจพัฒนาหุ่นยนต์\&quot;,\&quot;หลังจากกำหนดปัญหาหรือความต้องการของหุ่นยนต์แล้ว ขั้นตอนถัดไปคืออะไร\&quot;,[\&quot;เขียนโปรแกรมทันที\&quot;,\&quot;วิเคราะห์ภารกิจ\&quot;,\&quot;ทดสอบซ้ำและปรับปรุง\&quot;,\&quot;ประกอบระบบ\&quot;],1],\n[\&quot;ค้นหาความเสียหาย\&quot;,\&quot;ROBO-X รับข้อมูลได้แต่ไม่เคลื่อนที่\&quot;,\&quot;ควรวิเคราะห์ระบบใดเพิ่มเติม\&quot;,[\&quot;ระบบขับเคลื่อน\&quot;,\&quot;สีของโครงสร้าง\&quot;,\&quot;รูปแบบภายนอกของหุ่นยนต์\&quot;,\&quot;ขนาดของพื้นที่ทำงาน\&quot;],0],\n[\&quot;ซ่อมแซมระบบ\&quot;,\&quot;ROBO-X ทำงานผิดพลาดหลายส่วน\&quot;,\&quot;หากหุ่นยนต์ทำงานผิดพลาด ควรวิเคราะห์ปัญหาอย่างไร\&quot;,[\&quot;ตรวจสอบเฉพาะโปรแกรมเท่านั้น\&quot;,\&quot;ตรวจสอบเฉพาะโครงสร้างเท่านั้น\&quot;,\&quot;วิเคราะห์ทั้งโครงสร้าง วงจร เซนเซอร์ โปรแกรม ระบบขับเคลื่อน และพลังงาน\&quot;,\&quot;เปลี่ยนอุปกรณ์ทั้งหมดทันที\&quot;],2],\n[\&quot;ปลดล็อกขั้นสุดท้าย\&quot;,\&quot;ออกแบบหุ่นยนต์ภารกิจสุดท้าย\&quot;,\&quot;เหตุใดการสร้างหุ่นยนต์จึงต้องเริ่มจากการกำหนดภารกิจหรือความต้องการ\&quot;,[\&quot;เพื่อเลือกสีของหุ่นยนต์ให้เหมาะสม\&quot;,\&quot;เพื่อเลือกองค์ประกอบและออกแบบระบบให้เหมาะกับการทำงาน\&quot;,\&quot;เพื่อให้หุ่นยนต์มีขนาดใหญ่ขึ้น\&quot;,\&quot;เพื่อให้ไม่ต้องทดสอบระบบภายหลัง\&quot;],1]\n];\n\nlet index=0,score=0,player=\&quot;\&quot;;\n\nfunction startGame(){\nplayer=document.getElementById(\&quot;name\&quot;).value.trim();\nif(!player){\nalert(\&quot;กรุณากรอกชื่อ\&quot;);\nreturn;\n}\ndocument.getElementById(\&quot;start\&quot;).classList.add(\&quot;hidden\&quot;);\ndocument.getElementById(\&quot;quiz\&quot;).classList.remove(\&quot;hidden\&quot;);\nshowQuestion();\n}\nfunction showQuestion(){let q=questions[index];mission.innerHTML=\&quot;ด่าน \&quot;+(index+1);scene.innerHTML=\&quot;สถานการณ์: \&quot;+q[1];count.innerHTML=(index+1)+\&quot;/10\&quot;;bar.style.width=((index+1)*10)+\&quot;%\&quot;;question.innerHTML=q[2];options.innerHTML=\&quot;\&quot;;feedback.innerHTML=\&quot;\&quot;;nextBtn.style.display=\&quot;none\&quot;;q[3].forEach((a,i)=&gt;{let b=document.createElement(\&quot;button\&quot;);b.className=\&quot;option\&quot;;b.innerHTML=String.fromCharCode(65+i)+\&quot;. \&quot;+a;b.onclick=()=&gt;answer(i);options.appendChild(b);});}\nfunction answer(i){document.querySelectorAll(\&quot;.option\&quot;).forEach(b=&gt;b.disabled=true);if(i===questions[index][4]){score+=10;feedback.innerHTML=\&quot;🎉 ถูกต้อง! ROBO-X ได้รับพลังงานเพิ่ม 10 คะแนน 🤖\&quot;;feedback.style.background=\&quot;#dcfce7\&quot;}else{feedback.innerHTML=\&quot;💡 ยังไม่ถูกต้อง ลองทบทวนอีกครั้ง แล้วเตรียมเข้าสู่ภารกิจต่อไป\&quot;;feedback.style.background=\&quot;#fee2e2\&quot;}document.getElementById(\&quot;score\&quot;).innerHTML=score;nextBtn.style.display=\&quot;block\&quot;;}\nfunction nextQuestion(){index++;if(index&lt;questions.length)showQuestion();else finish();}\nfunction finish(){\nquiz.classList.add(\&quot;hidden\&quot;);\nresult.classList.remove(\&quot;hidden\&quot;);\nsummary.innerHTML=player+\&quot; ได้คะแนน \&quot;+score+\&quot; / 100\&quot;;\n\nfetch(WEB_APP_URL,{\nmethod:\&quot;POST\&quot;,\nbody:JSON.stringify({\nname:player,\nscore:score,\ncorrect:score/10\n})\n});\n\nloadOnlineHistory();\n}\n\nfunction loadOnlineHistory(){\nfetch(WEB_APP_URL)\n.then(r=&gt;r.json())\n.then(data=&gt;{\nlet rows=data.slice(1);\nfinalHistory.innerHTML=rows.map(x=&gt;\n`&lt;div class=\&quot;history-item\&quot;&gt;\n👤 ${x[1]}&lt;br&gt;\n⭐ ${x[2]} คะแนน&lt;br&gt;\n📅 ${formatDate(x[4],x[5])}\n&lt;/div&gt;`).join(\&quot;\&quot;) || \&quot;ยังไม่มีประวัติ\&quot;;\n})\n.catch(()=&gt;{\nfinalHistory.innerHTML=\&quot;ไม่สามารถโหลดประวัติออนไลน์ได้\&quot;;\n});\n}\nfunction loadHistory(){\nfetch(WEB_APP_URL)\n.then(r=&gt;r.json())\n.then(data=&gt;{\nlet rows=data.slice(1);\ndocument.getElementById(\&quot;history\&quot;).innerHTML=rows.map(x=&gt;\n`&lt;div class=\&quot;history-item\&quot;&gt;👤 ${x[1]}&lt;br&gt;⭐ ${x[2]} คะแนน&lt;br&gt;📅 ${formatDate(x[4],x[5])}&lt;/div&gt;`\n).join(\&quot;\&quot;) || \&quot;ยังไม่มีประวัติ\&quot;;\n})\n.catch(()=&gt;{\ndocument.getElementById(\&quot;history\&quot;).innerHTML=\&quot;ยังไม่มีประวัติ\&quot;;\n});\n}\nloadHistory();\n&lt;/script&gt;\n&lt;/body&gt;\n&lt;/html&gt;&quot;></iframe><iframe id="frame1" class="game-frame" srcdoc=&quot;&lt;!DOCTYPE html&gt;\n&lt;html lang=\&quot;th\&quot;&gt;\n&lt;head&gt;\n&lt;meta charset=\&quot;UTF-8\&quot;&gt;\n&lt;meta name=\&quot;viewport\&quot; content=\&quot;width=device-width, initial-scale=1.0\&quot;&gt;\n&lt;title&gt;ROBO-Z Classification Lab&lt;/title&gt;\n&lt;style&gt;\n*{box-sizing:border-box;font-family:\&quot;Tahoma\&quot;,\&quot;Noto Sans Thai\&quot;,Arial,sans-serif}\nbody{margin:0;background:linear-gradient(135deg,#0b132b,#2563eb);padding:20px;min-height:100vh;color:#111827}\n.card{max-width:1000px;margin:auto;background:#fff;border-radius:25px;padding:25px;box-shadow:0 10px 30px #0005}\nh1,h2{text-align:center;color:#1d4ed8;font-weight:800}\n.story{background:#eff6ff;padding:18px;border-radius:15px;line-height:1.9;font-size:18px;color:#111827}\ninput,button{width:100%;padding:14px;margin-top:12px;border-radius:12px;font-size:18px}\ninput{border:2px solid #ddd}\nbutton{background:#2563eb;color:white;border:0;cursor:pointer}\n.hidden{display:none}\n.layout{display:grid;grid-template-columns:1fr 1fr;gap:20px}\n.zone{background:#f8fafc;border:3px dashed #94a3b8;border-radius:15px;padding:15px;min-height:300px}\n.item{background:#dbeafe;padding:16px;margin:10px;border-radius:12px;cursor:grab;border:2px solid #2563eb;font-size:20px;font-weight:bold;color:#111827}\n.category{background:#dcfce7;padding:18px;margin:10px;border-radius:12px;min-height:70px;font-size:19px;font-weight:bold;color:#111827}\n.progress{height:22px;background:#ddd;border-radius:20px;overflow:hidden}\n.bar{height:100%;background:#22c55e;width:0}\n.feedback,.hint{margin-top:15px;padding:15px;border-radius:12px;background:#f1f5f9;font-size:18px;font-weight:bold;color:#111827}\n.score{text-align:center;font-size:22px}\n@media(max-width:700px){.layout{grid-template-columns:1fr}}\n&lt;/style&gt;\n&lt;/head&gt;\n&lt;body&gt;\n&lt;div class=\&quot;card\&quot;&gt;\n\n&lt;section id=\&quot;start\&quot;&gt;\n&lt;h1&gt;🤖 ROBO-Z: Classification Lab&lt;/h1&gt;\n&lt;div class=\&quot;story\&quot;&gt;\nคุณคือ &lt;b&gt;Nova นักวิเคราะห์ข้อมูลฝึกหัด&lt;/b&gt;&lt;br&gt;\nฐานข้อมูลองค์ประกอบของหุ่นยนต์ถูกสลับตำแหน่ง&lt;br&gt;\nภารกิจของคุณคือ ลาก Item กลับเข้าสู่หมวดหมู่ที่ถูกต้อง เพื่อช่วย Robo-Z ฟื้นฟูระบบ\n&lt;/div&gt;\n&lt;input id=\&quot;name\&quot; placeholder=\&quot;กรอกชื่อผู้เล่น\&quot;&gt;\n&lt;button onclick=\&quot;begin()\&quot;&gt;เริ่มภารกิจ 🚀&lt;/button&gt;\n&lt;/section&gt;\n\n&lt;section id=\&quot;game\&quot; class=\&quot;hidden\&quot;&gt;\n&lt;h2&gt;🛰️ Mission: Sort Robot Components&lt;/h2&gt;\n&lt;div class=\&quot;progress\&quot;&gt;&lt;div id=\&quot;bar\&quot; class=\&quot;bar\&quot;&gt;&lt;/div&gt;&lt;/div&gt;\n&lt;p class=\&quot;score\&quot;&gt;คะแนน &lt;span id=\&quot;score\&quot;&gt;0&lt;/span&gt;/100&lt;/p&gt;\n\n&lt;div class=\&quot;layout\&quot;&gt;\n&lt;div class=\&quot;zone\&quot;&gt;\n&lt;h3&gt;📦 Item Database&lt;/h3&gt;\n&lt;div id=\&quot;items\&quot;&gt;&lt;/div&gt;\n&lt;/div&gt;\n\n&lt;div class=\&quot;zone\&quot;&gt;\n&lt;h3&gt;🗂 Category Zone&lt;/h3&gt;\n&lt;div class=\&quot;category\&quot; data-cat=\&quot;โครงสร้างและส่วนประกอบ\&quot;&gt;🏗️ โครงสร้างและส่วนประกอบ&lt;/div&gt;\n&lt;div class=\&quot;category\&quot; data-cat=\&quot;ระบบตรวจจับและข้อมูล\&quot;&gt;👁️ ระบบตรวจจับและข้อมูล&lt;/div&gt;\n&lt;div class=\&quot;category\&quot; data-cat=\&quot;ระบบการเคลื่อนที่\&quot;&gt;⚙️ ระบบการเคลื่อนที่&lt;/div&gt;\n&lt;div class=\&quot;category\&quot; data-cat=\&quot;ระบบควบคุมและโปรแกรม\&quot;&gt;🧠 ระบบควบคุมและโปรแกรม&lt;/div&gt;\n&lt;div class=\&quot;category\&quot; data-cat=\&quot;ระบบพลังงาน\&quot;&gt;🔋 ระบบพลังงาน&lt;/div&gt;\n&lt;/div&gt;\n&lt;/div&gt;\n\n&lt;div id=\&quot;feedback\&quot; class=\&quot;feedback\&quot;&gt;&lt;/div&gt;\n&lt;div id=\&quot;hint\&quot; class=\&quot;hint\&quot;&gt;&lt;/div&gt;\n&lt;button onclick=\&quot;resetGame()\&quot;&gt;🔄 Reset Mission&lt;/button&gt;\n&lt;/section&gt;\n\n&lt;section id=\&quot;summary\&quot; class=\&quot;hidden\&quot;&gt;\n&lt;h2&gt;🎉 Mission Complete&lt;/h2&gt;\n&lt;div class=\&quot;story\&quot; id=\&quot;result\&quot;&gt;&lt;/div&gt;\n&lt;/section&gt;\n\n&lt;/div&gt;\n\n&lt;script&gt;\nconst WEB_APP_URL=\&quot;https://script.google.com/macros/s/AKfycbxeRZLX4Dcf3K3XzIwfekuPiS9sEbaCai_tG1kIJSge_wF4YFSR90qnt0NbAsd1sCVfvQ/exec\&quot;;\nlet player=\&quot;\&quot;,score=0,complete=0,wrongCount=0;\n\nconst data=[\n{name:\&quot;โครงสร้างหุ่นยนต์\&quot;,cat:\&quot;โครงสร้างและส่วนประกอบ\&quot;,hint:\&quot;ลองคิดถึงส่วนที่ทำหน้าที่รองรับอุปกรณ์ต่าง ๆ\&quot;},\n{name:\&quot;เซนเซอร์ (Sensor)\&quot;,cat:\&quot;ระบบตรวจจับและข้อมูล\&quot;,hint:\&quot;ลองคิดถึงส่วนที่รับข้อมูลจากสภาพแวดล้อม\&quot;},\n{name:\&quot;ระบบขับเคลื่อน\&quot;,cat:\&quot;ระบบการเคลื่อนที่\&quot;,hint:\&quot;ลองคิดถึงส่วนที่ทำให้หุ่นยนต์เกิดการเคลื่อนที่\&quot;},\n{name:\&quot;ระบบส่งกำลัง\&quot;,cat:\&quot;ระบบการเคลื่อนที่\&quot;,hint:\&quot;ลองคิดถึงการถ่ายทอดกำลังไปยังส่วนเคลื่อนที่\&quot;},\n{name:\&quot;ระบบนำทาง\&quot;,cat:\&quot;ระบบควบคุมและโปรแกรม\&quot;,hint:\&quot;ลองคิดถึงการกำหนดหรือควบคุมเส้นทาง\&quot;},\n{name:\&quot;Feedback\&quot;,cat:\&quot;ระบบควบคุมและโปรแกรม\&quot;,hint:\&quot;ลองคิดถึงการนำผลการทำงานกลับมาใช้ควบคุม\&quot;},\n{name:\&quot;แหล่งจ่ายพลังงาน\&quot;,cat:\&quot;ระบบพลังงาน\&quot;,hint:\&quot;ลองคิดถึงส่วนที่จ่ายพลังงานให้ระบบ\&quot;},\n{name:\&quot;ไมโครคอนโทรลเลอร์\&quot;,cat:\&quot;ระบบควบคุมและโปรแกรม\&quot;,hint:\&quot;ลองคิดถึงส่วนที่ประมวลผลและส่งคำสั่ง\&quot;},\n{name:\&quot;โปรแกรมควบคุม\&quot;,cat:\&quot;ระบบควบคุมและโปรแกรม\&quot;,hint:\&quot;ลองคิดถึงชุดคำสั่งกำหนดพฤติกรรม\&quot;},\n{name:\&quot;หุ่นยนต์เคลื่อนที่\&quot;,cat:\&quot;ระบบการเคลื่อนที่\&quot;,hint:\&quot;ลองคิดถึงประเภทของหุ่นยนต์ที่เคลื่อนที่ได้\&quot;}\n];\n\nfunction begin(){\nplayer=document.getElementById(\&quot;name\&quot;).value.trim();\nif(!player)return alert(\&quot;กรุณากรอกชื่อ\&quot;);\nstart.classList.add(\&quot;hidden\&quot;);\ngame.classList.remove(\&quot;hidden\&quot;);\nloadItems();\n}\n\nfunction loadItems(){\nitems.innerHTML=\&quot;\&quot;;\ndata.sort(()=&gt;Math.random()-0.5).forEach((d,i)=&gt;{\nlet e=document.createElement(\&quot;div\&quot;);\ne.className=\&quot;item\&quot;;\ne.draggable=true;\ne.textContent=d.name;\ne.dataset.cat=d.cat;\ne.dataset.hint=d.hint;\ne.ondragstart=x=&gt;x.dataTransfer.setData(\&quot;cat\&quot;,d.cat);\nitems.appendChild(e);\n});\ndocument.querySelectorAll(\&quot;.category\&quot;).forEach(c=&gt;{\nc.ondragover=e=&gt;e.preventDefault();\nc.ondrop=e=&gt;drop(c,e);\n});\n}\n\nasync function drop(zone,e){\nlet cat=e.dataTransfer.getData(\&quot;cat\&quot;);\nlet item=[...document.querySelectorAll(\&quot;.item\&quot;)].find(x=&gt;x.dataset.cat===cat);\nif(zone.dataset.cat===cat){\nzone.appendChild(item);\nitem.draggable=false;\nscore+=10;complete++;\ndocument.getElementById(\&quot;score\&quot;).textContent=score;\nfeedback.innerHTML=\&quot;✅ ถูกต้อง! Robo-Z บันทึกข้อมูลสำเร็จ +10 คะแนน\&quot;;\n}else{\nwrongCount++; feedback.innerHTML=\&quot;⚠️ ยังไม่ถูกต้อง\&quot;;\nhint.innerHTML=\&quot;💡 Hint: \&quot;+item.dataset.hint;\n}\nbar.style.width=(complete*10)+\&quot;%\&quot;;\nif(complete===10){\nawait saveResult();\ngame.classList.add(\&quot;hidden\&quot;);\nsummary.classList.remove(\&quot;hidden\&quot;);\nresult.innerHTML=`\n&lt;h2&gt;🤖 Robo-Z วิเคราะห์ผลภารกิจ&lt;/h2&gt;\n&lt;p&gt;👤 นักวิเคราะห์: &lt;b&gt;${player}&lt;/b&gt;&lt;/p&gt;\n&lt;p&gt;📦 จัดหมวดข้อมูลสำเร็จ: &lt;b&gt;${complete}/10&lt;/b&gt; รายการ&lt;/p&gt;\n&lt;p&gt;🔄 จำนวนครั้งที่ลองใหม่: &lt;b&gt;${wrongCount}&lt;/b&gt; ครั้ง&lt;/p&gt;\n&lt;hr&gt;\n${wrongCount&lt;=1?\n`🏆 &lt;b&gt;นักวิเคราะห์หุ่นยนต์ยอดเยี่ยม&lt;/b&gt;&lt;br&gt;\n🤖 Robo-Z:&lt;br&gt;\n\&quot;ยอดเยี่ยม! คุณสามารถวิเคราะห์ความสัมพันธ์ขององค์ประกอบหุ่นยนต์\nและจัดข้อมูลเข้าสู่หมวดที่เหมาะสมได้อย่างแม่นยำ\&quot;`:\nwrongCount&lt;=4?\n`🌟 &lt;b&gt;นักวิเคราะห์กำลังก้าวหน้า&lt;/b&gt;&lt;br&gt;\n🤖 Robo-Z:&lt;br&gt;\n\&quot;คุณมีความเข้าใจพื้นฐานขององค์ประกอบหุ่นยนต์แล้ว\nลองฝึกเชื่อมโยงหน้าที่ของแต่ละส่วนเพิ่มเติม เพื่อเพิ่มความแม่นยำ\&quot;`:\n`🌱 &lt;b&gt;นักวิเคราะห์ฝึกฝน&lt;/b&gt;&lt;br&gt;\n🤖 Robo-Z:&lt;br&gt;\n\&quot;ไม่เป็นไร ทุกการทดลองช่วยให้เรียนรู้มากขึ้น\nควรทบทวนหน้าที่ของแต่ละองค์ประกอบ และลองวิเคราะห์อีกครั้ง\&quot;`\n}\n`; ; saveResult();;\n}\n}\n\nfunction resetGame(){\nscore=0;complete=0;\ndocument.getElementById(\&quot;score\&quot;).textContent=0;\ndocument.getElementById(\&quot;bar\&quot;).style.width=\&quot;0%\&quot;;\nloadItems();\n}\n\nasync function saveResult(){\n try{\n  await fetch(WEB_APP_URL,{\n   method:&#x27;POST&#x27;,\n   body:JSON.stringify({\n    name:player,\n    correct:complete,\n    wrong:wrongCount||0\n   })\n  });\n }catch(e){}\n}\n&lt;/script&gt;\n&lt;/body&gt;\n&lt;/html&gt;&quot;></iframe><iframe id="frame2" class="game-frame" srcdoc=&quot;&lt;!DOCTYPE html&gt;\n&lt;html lang=\&quot;th\&quot;&gt;\n&lt;head&gt;\n&lt;meta charset=\&quot;UTF-8\&quot;&gt;\n&lt;meta name=\&quot;viewport\&quot; content=\&quot;width=device-width,initial-scale=1.0\&quot;&gt;\n&lt;title&gt;ROBO-Z Crisis Decision Mission&lt;/title&gt;\n&lt;style&gt;\nbody{font-family:Tahoma,&#x27;Noto Sans Thai&#x27;,sans-serif;background:#0f172a;padding:20px}\n.card{max-width:900px;margin:auto;background:white;padding:30px;border-radius:20px;line-height:1.8;color:#111}\nh1,h2{color:#2563eb;text-align:center}\n.box{background:#eff6ff;padding:20px;border-radius:15px;margin:15px 0;font-size:18px}\nbutton{width:100%;padding:15px;margin:8px 0;border:0;border-radius:12px;background:#2563eb;color:white;font-size:18px;cursor:pointer}\n.feedback{background:#dcfce7}\n.summary{background:#fef3c7}\n.hidden{display:none}\n&lt;/style&gt;\n&lt;/head&gt;\n&lt;body&gt;\n&lt;div class=\&quot;card\&quot;&gt;\n&lt;h1&gt;🤖 ROBO-Z: Crisis Decision Mission&lt;/h1&gt;&lt;p style=&#x27;text-align:center;font-size:20px;font-weight:bold&#x27;&gt;ภารกิจวิเคราะห์ปัญหาและตัดสินใจเพื่อกู้คืนระบบ Robo-Z&lt;/p&gt;\n\n\n&lt;div class=\&quot;box\&quot; style=\&quot;background:#fef3c7\&quot;&gt;\n&lt;h2&gt;🎮 วิธีการเล่นเกม&lt;/h2&gt;\n&lt;p&gt;\n&lt;b&gt;ROBO-Z: Crisis Decision Mission&lt;/b&gt;&lt;br&gt;\nเกมจำลองการตัดสินใจ เมื่อระบบของ Robo-Z เกิดปัญหา\nผู้เล่นต้องรับบทเป็นนักวิเคราะห์ ใช้ข้อมูลและหลักฐานที่มี\nเพื่อเลือกแนวทางแก้ไขที่เหมาะสม\n&lt;/p&gt;\n\n&lt;p&gt;&lt;b&gt;ขั้นตอนการเล่น&lt;/b&gt;&lt;/p&gt;\n&lt;p&gt;\n1️⃣ อ่าน &lt;b&gt;Situation (สถานการณ์)&lt;/b&gt;&lt;br&gt;\nทำความเข้าใจว่า Robo-Z กำลังพบปัญหาอะไร&lt;br&gt;&lt;br&gt;\n\n2️⃣ วิเคราะห์ &lt;b&gt;Evidence (หลักฐาน)&lt;/b&gt;&lt;br&gt;\nพิจารณาข้อมูลที่ Robo-Z พบ ก่อนตัดสินใจ&lt;br&gt;&lt;br&gt;\n\n3️⃣ เลือก &lt;b&gt;Decision (การตัดสินใจ)&lt;/b&gt;&lt;br&gt;\nเลือก 1 ทางเลือกที่คิดว่าเหมาะสมที่สุด&lt;br&gt;&lt;br&gt;\n\n4️⃣ ดู &lt;b&gt;Consequence (ผลลัพธ์)&lt;/b&gt;&lt;br&gt;\nตรวจสอบว่าการตัดสินใจส่งผลอย่างไร&lt;br&gt;&lt;br&gt;\n\n5️⃣ อ่าน &lt;b&gt;Feedback จาก Robo-Z&lt;/b&gt;&lt;br&gt;\nเรียนรู้จากผลลัพธ์ และเดินหน้าสู่สถานการณ์ถัดไป\n&lt;/p&gt;\n\n&lt;p&gt;\n💡 &lt;b&gt;เคล็ดลับ:&lt;/b&gt;&lt;br&gt;\n- อย่าเลือกจากการคาดเดา ให้ใช้ Evidence เป็นตัวช่วย&lt;br&gt;\n- การเลือกผิดไม่ใช่จุดจบ ผู้เล่นสามารถเรียนรู้จากผลลัพธ์ได้&lt;br&gt;\n- ตอนจบระบบจะแสดงเส้นทางการตัดสินใจที่คุณเลือก\n&lt;/p&gt;\n&lt;/div&gt;\n\n&lt;div id=\&quot;game\&quot;&gt;\n&lt;div class=\&quot;box\&quot;&gt;\n&lt;h2&gt;Current Turn: &lt;span id=\&quot;turn\&quot;&gt;1&lt;/span&gt;/3&lt;/h2&gt;\n&lt;b&gt;📌 Situation&lt;/b&gt;\n&lt;p id=\&quot;situation\&quot;&gt;&lt;/p&gt;\n&lt;/div&gt;\n\n&lt;div class=\&quot;box\&quot;&gt;\n&lt;b&gt;🔎 Evidence&lt;/b&gt;\n&lt;p id=\&quot;evidence\&quot;&gt;&lt;/p&gt;\n&lt;/div&gt;\n\n&lt;div class=\&quot;box\&quot;&gt;\n&lt;b&gt;🧠 Decision&lt;/b&gt;\n&lt;div id=\&quot;choices\&quot;&gt;&lt;/div&gt;\n&lt;/div&gt;\n\n&lt;div class=\&quot;box\&quot;&gt;\n&lt;b&gt;⚙️ Consequence&lt;/b&gt;\n&lt;p id=\&quot;consequence\&quot;&gt;รอการตัดสินใจ&lt;/p&gt;\n&lt;/div&gt;\n\n&lt;div class=\&quot;box feedback\&quot;&gt;\n&lt;b&gt;🤖 Robo-Z Feedback&lt;/b&gt;\n&lt;p id=\&quot;feedback\&quot;&gt;เลือกแนวทางเพื่อดำเนินภารกิจ&lt;/p&gt;\n&lt;/div&gt;\n\n&lt;button onclick=\&quot;restart()\&quot;&gt;🔄 Restart Mission&lt;/button&gt;\n&lt;/div&gt;\n\n&lt;div id=\&quot;summary\&quot; class=\&quot;summary hidden\&quot;&gt;&lt;/div&gt;\n\n&lt;script&gt;\nconst tree={\nstart:{\ns:\&quot;Robo-Z พบความผิดปกติของระบบ นักวิเคราะห์ต้องตรวจสอบข้อมูลและเลือกแนวทางแก้ไข\&quot;,\ne:[\&quot;Evidence 1: พบความผิดปกติ\&quot;,\&quot;Evidence 2: มีข้อมูลที่ต้องวิเคราะห์\&quot;,\&quot;Evidence 3: ต้องเลือกแนวทางดำเนินการ\&quot;],\nc:[\n[\&quot;ตรวจสอบหลักฐานเพิ่มเติม\&quot;,\&quot;level2\&quot;,\&quot;ได้รับข้อมูลใหม่\&quot;,\&quot;การวิเคราะห์ข้อมูลช่วยให้เข้าใจปัญหา\&quot;,\&quot;Success Path\&quot;],\n[\&quot;ดำเนินการแก้ไขทันที\&quot;,\&quot;retry\&quot;,\&quot;พบว่ายังมีข้อมูลไม่เพียงพอ\&quot;,\&quot;ควรตรวจสอบก่อนตัดสินใจ\&quot;,\&quot;Retry Path\&quot;],\n[\&quot;ข้ามการวิเคราะห์\&quot;,\&quot;bad\&quot;,\&quot;เกิดความล่าช้า\&quot;,\&quot;แนวทางนี้ใช้ทรัพยากรโดยไม่จำเป็น\&quot;,\&quot;Inefficient Path\&quot;]]},\nlevel2:{\ns:\&quot;Robo-Z ส่งหลักฐานใหม่ นักวิเคราะห์ต้องประเมินสถานการณ์อีกครั้ง\&quot;,\ne:[\&quot;New Evidence 1: พบข้อมูลเพิ่มเติม\&quot;,\&quot;New Evidence 2: ต้องเปรียบเทียบข้อมูล\&quot;,\&quot;New Evidence 3: ต้องเลือกวิธีดำเนินการ\&quot;],\nc:[\n[\&quot;วิเคราะห์สาเหตุ\&quot;,\&quot;final\&quot;,\&quot;พบแนวทางแก้ไข\&quot;,\&quot;คุณใช้หลักฐานประกอบการตัดสินใจ\&quot;,\&quot;ไปยังการตัดสินใจสุดท้าย\&quot;],\n[\&quot;ทดลองบางส่วน\&quot;,\&quot;retry\&quot;,\&quot;ต้องกลับมาตรวจสอบ\&quot;,\&quot;เรียนรู้จากผลลัพธ์\&quot;,\&quot;Retry Path\&quot;],\n[\&quot;เลือกวิธีที่ไม่เกี่ยวข้อง\&quot;,\&quot;bad\&quot;,\&quot;ปัญหายังคงอยู่\&quot;,\&quot;ควรเชื่อมโยงข้อมูลก่อนเลือก\&quot;,\&quot;Inefficient Path\&quot;]]},\nfinal:{\ns:\&quot;ขั้นตอนสุดท้าย: เลือกแนวทางแก้ไขระบบ\&quot;,\ne:[\&quot;New Evidence: ต้องตัดสินใจขั้นสุดท้าย\&quot;],\nc:[\n[\&quot;เลือกแนวทางเหมาะสม\&quot;,\&quot;success\&quot;,\&quot;ระบบกลับมาทำงาน\&quot;,\&quot;ยอดเยี่ยม!\&quot;,\&quot;Success Path\&quot;],\n[\&quot;ตรวจสอบเพิ่มเติม\&quot;,\&quot;retry\&quot;,\&quot;ยังต้องวิเคราะห์\&quot;,\&quot;ลองใหม่อีกครั้ง\&quot;,\&quot;Retry Path\&quot;],\n[\&quot;ใช้วิธีไม่เหมาะสม\&quot;,\&quot;bad\&quot;,\&quot;ระบบยังมีปัญหา\&quot;,\&quot;ควรทบทวนหลักฐาน\&quot;,\&quot;Inefficient Path\&quot;]]},\nsuccess:{s:\&quot;ภารกิจสำเร็จ\&quot;,e:[\&quot;ระบบได้รับการแก้ไข\&quot;],c:[]},\nretry:{s:\&quot;ต้องย้อนกลับไปวิเคราะห์ใหม่\&quot;,e:[\&quot;พบข้อมูลเพิ่มเติม\&quot;],c:[]},\nbad:{s:\&quot;เส้นทางไม่มีประสิทธิภาพ\&quot;,e:[\&quot;ปัญหายังไม่ได้รับการแก้ไข\&quot;],c:[]}\n};\n\nlet node=\&quot;start\&quot;,turn=1,path=[]; let correct=0; let wrong=0;\n\nfunction render(){\nlet n=tree[node];\nsituation.innerHTML=n.s;\nevidence.innerHTML=n.e.join(\&quot;&lt;br&gt;\&quot;);\ndocument.getElementById(\&quot;turn\&quot;).innerHTML=turn;\nchoices.innerHTML=\&quot;\&quot;;\nn.c.forEach(x=&gt;{\nlet b=document.createElement(\&quot;button\&quot;);\nb.innerHTML=x[0];\nb.onclick=()=&gt;choose(x);\nchoices.appendChild(b);\n});\nif(n.c.length===0)setTimeout(end,500);\n}\n\nfunction choose(x){\nlet result = (x[4]==\&quot;Success Path\&quot;) ? \&quot;✅ ถูกต้อง\&quot; : (x[4]==\&quot;Retry Path\&quot; ? \&quot;🟡 ควรทบทวน\&quot; : \&quot;❌ ไม่เหมาะสม\&quot;);\nif(x[4]==\&quot;Success Path\&quot;){correct++;}else{wrong++;}\npath.push(\&quot;Turn \&quot;+turn+\&quot;: \&quot;+x[0]+\&quot; → \&quot;+result+\&quot; (\&quot;+x[4]+\&quot;)\&quot;);\nconsequence.innerHTML=x[2];\nfeedback.innerHTML=x[3];\nnode=x[1];\nturn++;\nsetTimeout(render,800);\n}\n\nfunction end(){\ngame.className=\&quot;hidden\&quot;;\nsummary.className=\&quot;box\&quot;;\nsummary.innerHTML=\n\&quot;&lt;h2&gt;🎉 Mission Summary&lt;/h2&gt;\&quot;+\n\&quot;&lt;p&gt;&lt;b&gt;ผลการตัดสินใจของคุณ&lt;/b&gt;&lt;/p&gt;\&quot;+\npath.join(\&quot;&lt;br&gt;\&quot;)+\n\&quot;&lt;br&gt;&lt;br&gt;✅ การเลือกที่เหมาะสม: \&quot;+correct+\&quot; ครั้ง\&quot;+\n\&quot;&lt;br&gt;❌ การเลือกที่ควรปรับปรุง: \&quot;+wrong+\&quot; ครั้ง\&quot;+\n\&quot;&lt;br&gt;&lt;br&gt;🤖 Robo-Z: ภารกิจสิ้นสุด พร้อมเรียนรู้จากทุกการตัดสินใจ\&quot;;\n}\n\nfunction restart(){\nnode=\&quot;start\&quot;;turn=1;path=[];\ngame.className=\&quot;\&quot;;\nsummary.className=\&quot;hidden\&quot;;\nrender();\n}\nrender();\n&lt;/script&gt;\n&lt;/div&gt;\n&lt;/body&gt;\n&lt;/html&gt;&quot;></iframe><iframe id="frame3" class="game-frame" srcdoc=&quot;&lt;!DOCTYPE html&gt;\n&lt;html lang=\&quot;th\&quot;&gt;\n&lt;head&gt;\n&lt;meta charset=\&quot;UTF-8\&quot;&gt;\n&lt;meta name=\&quot;viewport\&quot; content=\&quot;width=device-width, initial-scale=1.0\&quot;&gt;\n&lt;title&gt;ROBO-Z System Rescue Escape Mission&lt;/title&gt;\n&lt;style&gt;\nbody{font-family:\&quot;Noto Sans Thai\&quot;,Tahoma,sans-serif;background:#0f172a;padding:20px;color:#111}\n.card{max-width:950px;margin:auto;background:white;border-radius:25px;padding:30px;line-height:1.8}\nh1,h2{text-align:center;color:#2563eb}\n.box{background:#eff6ff;padding:20px;border-radius:15px;margin:15px 0;font-size:18px}\nbutton{width:100%;padding:15px;margin:8px 0;border:0;border-radius:12px;background:#2563eb;color:white;font-size:18px;font-weight:bold}\ninput{width:100%;padding:14px;font-size:18px;border-radius:10px;border:2px solid #ccc}\n\n.hidden{display:none}\n\n#robot{\nfont-size:90px;\ntext-align:center;\ntransition:.3s;\n}\n\n.robot-idle{\nanimation:float 2s infinite ease-in-out;\n}\n\n.robot-danger{\nanimation:shake .35s infinite;\nfilter:drop-shadow(0 0 12px red);\n}\n\n.robot-success{\nanimation:jump .6s;\n}\n\n@keyframes float{\n0%,100%{transform:translateY(0)}\n50%{transform:translateY(-12px)}\n}\n\n@keyframes shake{\n0%{transform:translateX(0) rotate(0)}\n25%{transform:translateX(-8px) rotate(-5deg)}\n50%{transform:translateX(8px) rotate(5deg)}\n75%{transform:translateX(-8px) rotate(-5deg)}\n100%{transform:translateX(0)}\n}\n\n@keyframes jump{\n0%{transform:scale(1)}\n50%{transform:scale(1.2) translateY(-15px)}\n100%{transform:scale(1)}\n}\n\n\n.robot-broken{\nanimation:broken .8s infinite;\nfilter:grayscale(1) drop-shadow(0 0 15px red);\nopacity:.5;\n}\n\n@keyframes broken{\n0%{transform:rotate(0) translateY(0)}\n25%{transform:rotate(-8deg) translateY(8px)}\n50%{transform:rotate(8deg) translateY(15px)}\n75%{transform:rotate(-8deg) translateY(8px)}\n100%{transform:rotate(0) translateY(0)}\n}\n\n.broken-screen{\nbackground:#fee2e2;\ncolor:#991b1b;\npadding:20px;\nborder-radius:15px;\nfont-size:22px;\nfont-weight:bold;\n}\n\n.damage{\ncolor:#dc2626;\n\nfont-weight:bold;\nanimation:blink .5s infinite;\n}\n\n@keyframes blink{\n50%{opacity:.3}\n}\n\n.success{background:#dcfce7;padding:15px;border-radius:12px}\n.code{background:#fef3c7;padding:15px;border-radius:12px;font-weight:bold}\n&lt;/style&gt;\n&lt;/head&gt;\n&lt;body&gt;\n&lt;div class=\&quot;card\&quot;&gt;\n\n&lt;div id=\&quot;start\&quot;&gt;\n&lt;h1&gt;🤖 ROBO-Z: System Rescue Escape Mission&lt;/h1&gt;\n&lt;div class=\&quot;box\&quot;&gt;\n🚨 Robo-Z เกิดความผิดปกติของระบบ&lt;br&gt;\nคุณต้องช่วยวิเคราะห์องค์ประกอบของหุ่นยนต์ แก้ปัญหา และปลดล็อกระบบเพื่อกู้คืนภารกิจ\n&lt;/div&gt;\n\n&lt;input id=\&quot;name\&quot; placeholder=\&quot;กรอกชื่อนักวิเคราะห์\&quot;&gt;\n\n&lt;h3&gt;เลือกตัวละคร&lt;/h3&gt;\n&lt;button onclick=\&quot;character=&#x27;Nova นักวิเคราะห์&#x27;;showChar()\&quot;&gt;👩‍🔬 Nova นักวิเคราะห์&lt;/button&gt;\n&lt;button onclick=\&quot;character=&#x27;Engineer วิศวกรระบบ&#x27;;showChar()\&quot;&gt;🧑‍🔧 Engineer วิศวกรระบบ&lt;/button&gt;\n&lt;button onclick=\&quot;character=&#x27;AI Assistant&#x27;;showChar()\&quot;&gt;🤖 AI Assistant&lt;/button&gt;\n\n&lt;p id=\&quot;char\&quot;&gt;&lt;/p&gt;\n&lt;button onclick=\&quot;begin()\&quot;&gt;🚀 เริ่มภารกิจ&lt;/button&gt;\n&lt;/div&gt;\n\n\n\n&lt;div id=\&quot;robot\&quot; class=\&quot;robot-idle\&quot;&gt;🤖&lt;/div&gt;\n&lt;div id=\&quot;game\&quot; class=\&quot;hidden\&quot;&gt;\n\n\n&lt;h2&gt;Mission &lt;span id=\&quot;level\&quot;&gt;&lt;/span&gt;&lt;/h2&gt;\n\n&lt;div class=\&quot;box\&quot;&gt;\n&lt;h3&gt;📌 สถานการณ์&lt;/h3&gt;\n&lt;p id=\&quot;story\&quot;&gt;&lt;/p&gt;\n&lt;/div&gt;\n\n&lt;div class=\&quot;box\&quot;&gt;\n&lt;h3&gt;🎯 Challenge&lt;/h3&gt;\n&lt;p id=\&quot;challenge\&quot;&gt;&lt;/p&gt;\n&lt;div id=\&quot;choices\&quot;&gt;&lt;/div&gt;\n&lt;/div&gt;\n\n&lt;div class=\&quot;box\&quot;&gt;\n&lt;h3&gt;🤖 Robo-Z Feedback&lt;/h3&gt;\n&lt;p id=\&quot;feedback\&quot;&gt;&lt;/p&gt;\n&lt;/div&gt;\n\n&lt;div class=\&quot;code\&quot;&gt;\n🔐 Code Unlock:\n&lt;span id=\&quot;code\&quot;&gt;---&lt;/span&gt;\n&lt;/div&gt;\n\n&lt;/div&gt;\n\n\n&lt;div id=\&quot;end\&quot; class=\&quot;hidden box\&quot;&gt;&lt;/div&gt;\n\n&lt;/div&gt;\n\n&lt;script&gt;\nlet character=\&quot;\&quot;;\nlet player=\&quot;\&quot;;\nlet current=0;\nlet codes=[];\nlet wrongCount=0;\n\nconst missions=[\n{\nlevel:\&quot;Level 1: Understanding\&quot;,\nstory:\&quot;Robo-Z ต้องการตรวจสอบองค์ประกอบของระบบหุ่นยนต์ก่อนเปิดระบบหลัก\&quot;,\nchallenge:\&quot;เลือกกลุ่มข้อมูลที่เกี่ยวข้องกับองค์ประกอบของหุ่นยนต์\&quot;,\nchoices:[\n[\&quot;ตรวจสอบระบบพลังงาน ระบบควบคุม และระบบตรวจจับ\&quot;,\&quot;ถูกต้อง! เข้าใจองค์ประกอบของระบบ\&quot;,\&quot;CORE-01\&quot;],\n[\&quot;ข้ามการตรวจสอบและเริ่มทำงานทันที\&quot;,\&quot;ข้อมูลยังไม่เพียงพอ\&quot;,\&quot;RETRY\&quot;],\n[\&quot;เลือกเฉพาะส่วนที่ไม่เกี่ยวข้องกับระบบ\&quot;,\&quot;ต้องทบทวนองค์ประกอบ\&quot;,\&quot;FAIL\&quot;]\n]\n},\n{\nlevel:\&quot;Level 2: Application\&quot;,\nstory:\&quot;Robo-Z พบปัญหาในการทำงาน ต้องนำความรู้ไปประยุกต์ใช้\&quot;,\nchallenge:\&quot;เลือกแนวทางแก้ไขที่เชื่อมโยงกับหน้าที่ของระบบ\&quot;,\nchoices:[\n[\&quot;วิเคราะห์ระบบที่เกี่ยวข้องก่อนแก้ไข\&quot;,\&quot;ยอดเยี่ยม! ใช้ความรู้แก้ปัญหา\&quot;,\&quot;APPLY-02\&quot;],\n[\&quot;เปลี่ยนทุกระบบโดยไม่ตรวจสอบ\&quot;,\&quot;อาจทำให้เกิดปัญหาเพิ่ม\&quot;,\&quot;RETRY\&quot;],\n[\&quot;ไม่วิเคราะห์ข้อมูล\&quot;,\&quot;ไม่สามารถแก้ปัญหาได้\&quot;,\&quot;FAIL\&quot;]\n]\n},\n{\nlevel:\&quot;Level 3: Analysis\&quot;,\nstory:\&quot;Robo-Z ต้องการตัดสินใจขั้นสุดท้ายเพื่อกู้คืนระบบ\&quot;,\nchallenge:\&quot;วิเคราะห์ข้อมูลหลายส่วนและเลือกแนวทางที่เหมาะสม\&quot;,\nchoices:[\n[\&quot;เชื่อมโยงข้อมูลหลายระบบก่อนตัดสินใจ\&quot;,\&quot;สำเร็จ! วิเคราะห์เป็นระบบ\&quot;,\&quot;MASTER-03\&quot;],\n[\&quot;ทดลองแบบไม่มีแผน\&quot;,\&quot;ควรใช้ข้อมูลประกอบ\&quot;,\&quot;RETRY\&quot;],\n[\&quot;เลือกจากการคาดเดา\&quot;,\&quot;ต้องวิเคราะห์หลักฐาน\&quot;,\&quot;FAIL\&quot;]\n]\n}\n];\n\nfunction showChar(){\ndocument.getElementById(\&quot;char\&quot;).innerHTML=\&quot;ตัวละครที่เลือก: \&quot;+character;\n}\n\nfunction begin(){\nplayer=document.getElementById(\&quot;name\&quot;).value;\nif(!player||!character){alert(\&quot;กรุณากรอกชื่อและเลือกตัวละคร\&quot;);return;}\nstart.className=\&quot;hidden\&quot;;\ngame.className=\&quot;\&quot;;\nload();\n}\n\nfunction load(){\nlet m=missions[current];\nlevel.innerHTML=m.level;\nstory.innerHTML=m.story;\nchallenge.innerHTML=m.challenge;\nfeedback.innerHTML=\&quot;เลือกคำตอบเพื่อดำเนินภารกิจ\&quot;;\ncode.innerHTML=\&quot;---\&quot;;\nchoices.innerHTML=\&quot;\&quot;;\nm.choices.forEach(c=&gt;{\nlet b=document.createElement(\&quot;button\&quot;);\nb.innerHTML=c[0];\nb.onclick=()=&gt;answer(c);\nchoices.appendChild(b);\n});\n}\n\nfunction answer(c){\n\nfeedback.innerHTML=c[1];\n\nlet robot=document.getElementById(\&quot;robot\&quot;);\n\nif(c[2]==\&quot;RETRY\&quot; || c[2]==\&quot;FAIL\&quot;){\n robot.className=\&quot;robot-danger\&quot;;\n feedback.innerHTML += \&quot;&lt;br&gt;&lt;span class=&#x27;damage&#x27;&gt;⚠️ Robo-Z ระบบเริ่มผิดปกติ! ต้องวิเคราะห์ใหม่&lt;/span&gt;\&quot;;\n \nsetTimeout(()=&gt;{robot.className=\&quot;robot-idle\&quot;;},1500);\n\nif(wrongCount&gt;=2){\nsetTimeout(robotBroken,1000);\nreturn;\n}\n\n}else{\n robot.className=\&quot;robot-success\&quot;;\n setTimeout(()=&gt;{robot.className=\&quot;robot-idle\&quot;;},1000);\n}\n\nif(c[2]!=\&quot;RETRY\&quot;&amp;&amp;c[2]!=\&quot;FAIL\&quot;){\ncodes.push(c[2]);\ncode.innerHTML=c[2];\ncurrent++;\nif(current&lt;missions.length){\nsetTimeout(load,1200);\n}else{\nsetTimeout(finish,1200);\n}\n}else{\nfeedback.innerHTML+=\&quot;&lt;br&gt;ลองวิเคราะห์ข้อมูลใหม่อีกครั้ง\&quot;;\n}\n}\n\n\nfunction robotBroken(){\n\ngame.className=\&quot;hidden\&quot;;\nend.className=\&quot;box broken-screen\&quot;;\n\nend.innerHTML=\n\&quot;&lt;div id=&#x27;brokenRobot&#x27;&gt;🤖💥&lt;/div&gt;\&quot;+\n\&quot;&lt;h2&gt;🚨 SYSTEM FAILURE&lt;/h2&gt;\&quot;+\n\&quot;Robo-Z ไม่สามารถทำงานต่อได้&lt;br&gt;&lt;br&gt;\&quot;+\n\&quot;จำนวนความผิดพลาด: \&quot;+wrongCount+\&quot; ครั้ง&lt;br&gt;&lt;br&gt;\&quot;+\n\&quot;🤖 Robo-Z:&lt;br&gt;\&quot;+\n\&quot;ระบบเสียหายจากการตัดสินใจที่ไม่เหมาะสม&lt;br&gt;\&quot;+\n\&quot;ลองเริ่มภารกิจใหม่และวิเคราะห์ข้อมูลให้รอบคอบขึ้น\&quot;;\n\ndocument.getElementById(\&quot;brokenRobot\&quot;).className=\&quot;robot-broken\&quot;;\n\n}\n\n\nfunction finish(){\n\ngame.className=\&quot;hidden\&quot;;\nend.className=\&quot;\&quot;;\nend.innerHTML=\&quot;&lt;h2&gt;🎉 Mission Complete&lt;/h2&gt;\&quot;+\n\&quot;นักวิเคราะห์: \&quot;+player+\&quot;&lt;br&gt;\&quot;+\n\&quot;ตัวละคร: \&quot;+character+\&quot;&lt;br&gt;&lt;br&gt;\&quot;+\n\&quot;Code ที่ปลดล็อก:&lt;br&gt;\&quot;+codes.join(\&quot; → \&quot;)+\n\&quot;&lt;br&gt;&lt;br&gt;🤖 Robo-Z: คุณสามารถบูรณาการความรู้เพื่อกู้คืนระบบได้สำเร็จ\&quot;;\n}\n&lt;/script&gt;\n\n&lt;/body&gt;\n&lt;/html&gt;&quot;></iframe><iframe id="frame4" class="game-frame" srcdoc=&quot;&lt;!DOCTYPE html&gt;\n&lt;html lang=\&quot;th\&quot;&gt;\n&lt;head&gt;\n&lt;meta charset=\&quot;UTF-8\&quot;&gt;\n&lt;meta name=\&quot;viewport\&quot; content=\&quot;width=device-width,initial-scale=1.0\&quot;&gt;\n&lt;title&gt;ROBO-Z AI Simulation State Machine&lt;/title&gt;\n&lt;style&gt;\nbody{font-family:&#x27;Noto Sans Thai&#x27;,&#x27;Sarabun&#x27;,Tahoma,sans-serif;background:#0f172a;padding:20px;color:#111827}\n.card{max-width:950px;margin:auto;background:white;padding:35px;border-radius:20px;line-height:1.9;font-size:20px}\nh1{font-size:34px;text-align:center;color:#2563eb} h2{font-size:28px;text-align:center;color:#2563eb} h3{font-size:24px}\n.box{background:#eff6ff;padding:22px;border-radius:15px;margin:18px 0;font-size:20px;color:#111827}\n.status{background:#dcfce7}\n.resource{background:#fef3c7}\nbutton{width:100%;padding:18px;margin:10px 0;border:0;border-radius:12px;background:#2563eb;color:white;font-size:21px;font-weight:bold;line-height:1.5}\n.log{background:#f3f4f6;padding:20px;border-radius:10px;font-size:18px}\n.hidden{display:none}\n&lt;/style&gt;\n&lt;/head&gt;\n&lt;body&gt;\n&lt;div class=\&quot;card\&quot;&gt;\n\n&lt;h1&gt;🤖 ROBO-Z: System Simulation Mission&lt;/h1&gt;\n\n\n&lt;div class=\&quot;box\&quot; style=\&quot;background:#fef3c7\&quot;&gt;\n&lt;h2&gt;🎮 คำอธิบายเกม&lt;/h2&gt;\n\n&lt;p&gt;\n&lt;b&gt;ROBO-Z: System Simulation Mission&lt;/b&gt;&lt;br&gt;\nเป็นเกมจำลองสถานการณ์ที่ผู้เล่นรับบทเป็นนักวิเคราะห์ระบบ\nต้องช่วย Robo-Z แก้ไขปัญหาที่เกิดขึ้น โดยใช้ข้อมูล หลักฐาน\nและทรัพยากรที่มีจำกัด เพื่อวางแผนและตัดสินใจให้เหมาะสม\n&lt;/p&gt;\n\n&lt;p&gt;&lt;b&gt;🎯 เป้าหมายของเกม&lt;/b&gt;&lt;/p&gt;\n&lt;p&gt;\nผู้เล่นต้องบริหารทรัพยากร เลือก Action ที่เหมาะสม\nวิเคราะห์ผลกระทบ และนำระบบ Robo-Z กลับมาทำงานให้สำเร็จ\n&lt;/p&gt;\n\n&lt;p&gt;&lt;b&gt;🕹️ วิธีการเล่น&lt;/b&gt;&lt;/p&gt;\n&lt;p&gt;\n1️⃣ อ่านสถานะระบบ (System Status) เพื่อดูปัญหาปัจจุบัน&lt;br&gt;\n2️⃣ วิเคราะห์หลักฐาน (Evidence Panel) ที่ Robo-Z พบ&lt;br&gt;\n3️⃣ ตรวจสอบทรัพยากรที่เหลือ (Budget) ก่อนเลือก Action&lt;br&gt;\n4️⃣ เลือกการกระทำ (Action) ที่คิดว่าเหมาะสมที่สุด&lt;br&gt;\n5️⃣ ดูผลลัพธ์ (Feedback และ Event Log) จากการตัดสินใจ&lt;br&gt;\n6️⃣ เล่นต่อจนระบบเปลี่ยนสถานะ หรือจบภารกิจ\n&lt;/p&gt;\n\n&lt;p&gt;&lt;b&gt;💡 คำแนะนำ&lt;/b&gt;&lt;/p&gt;\n&lt;p&gt;\nการเลือกแต่ละครั้งส่งผลต่อทรัพยากรและสถานการณ์ในอนาคต\nควรวิเคราะห์ข้อมูลก่อนตัดสินใจ ไม่ควรเลือกจากการคาดเดา\n&lt;/p&gt;\n&lt;/div&gt;\n\n&lt;div id=\&quot;game\&quot;&gt;\n\n&lt;div class=\&quot;box status\&quot;&gt;\n&lt;h2&gt;🌐 System Status&lt;/h2&gt;\n&lt;p id=\&quot;status\&quot;&gt;&lt;/p&gt;\n&lt;/div&gt;\n\n&lt;div class=\&quot;box\&quot;&gt;\n&lt;h2&gt;🔎 Evidence Panel&lt;/h2&gt;\n&lt;p id=\&quot;evidence\&quot;&gt;&lt;/p&gt;\n&lt;/div&gt;\n\n&lt;div class=\&quot;box resource\&quot;&gt;\n&lt;h2&gt;🔋 Resource / Budget&lt;/h2&gt;\n&lt;p&gt;Budget: &lt;span id=\&quot;budget\&quot;&gt;&lt;/span&gt; | Turn: &lt;span id=\&quot;turn\&quot;&gt;&lt;/span&gt;&lt;/p&gt;\n&lt;/div&gt;\n\n&lt;div class=\&quot;box\&quot;&gt;\n&lt;h2&gt;🎯 Available Actions&lt;/h2&gt;\n&lt;div id=\&quot;actions\&quot;&gt;&lt;/div&gt;\n&lt;/div&gt;\n\n&lt;div class=\&quot;box\&quot;&gt;\n&lt;h2&gt;🤖 Feedback&lt;/h2&gt;\n&lt;p id=\&quot;feedback\&quot;&gt;เลือก Action เพื่อดำเนินการ&lt;/p&gt;\n&lt;/div&gt;\n\n&lt;div class=\&quot;box log\&quot;&gt;\n&lt;h2&gt;📜 Event Log&lt;/h2&gt;\n&lt;div id=\&quot;log\&quot;&gt;&lt;/div&gt;\n&lt;/div&gt;\n\n&lt;/div&gt;\n\n&lt;div id=\&quot;summary\&quot; class=\&quot;hidden box\&quot;&gt;&lt;/div&gt;\n\n&lt;script&gt;\nconst states={\nS1:{\nstatus:\&quot;Robo-Z พบความผิดปกติของระบบ แต่ยังไม่ทราบสาเหตุที่แท้จริง\&quot;,\nevidence:[\&quot;พบข้อมูลระบบผิดปกติ\&quot;,\&quot;มีข้อมูลบางส่วนต้องตรวจสอบ\&quot;,\&quot;ทรัพยากรมีจำกัด\&quot;],\nactions:[\n[\&quot;ตรวจสอบข้อมูลระบบ\&quot;,\&quot;10\&quot;,\&quot;1\&quot;,\&quot;ได้รับข้อมูลเพิ่ม\&quot;,\&quot;S2\&quot;],\n[\&quot;เปลี่ยนอุปกรณ์ทันที\&quot;,\&quot;30\&quot;,\&quot;2\&quot;,\&quot;เสียทรัพยากรแต่ยังไม่ทราบสาเหตุ\&quot;,\&quot;S3\&quot;],\n[\&quot;หยุดระบบทั้งหมด\&quot;,\&quot;20\&quot;,\&quot;1\&quot;,\&quot;ลดความเสี่ยงแต่ขาดข้อมูล\&quot;,\&quot;S4\&quot;]]},\nS2:{\nstatus:\&quot;ได้รับข้อมูลเพิ่มเติม ต้องวิเคราะห์ก่อนแก้ไข\&quot;,\nevidence:[\&quot;พบความสัมพันธ์ของข้อมูล\&quot;,\&quot;พบจุดที่ต้องตรวจสอบ\&quot;],\nactions:[\n[\&quot;วิเคราะห์สาเหตุจากข้อมูล\&quot;,\&quot;15\&quot;,\&quot;1\&quot;,\&quot;พบแนวทางแก้ไข\&quot;,\&quot;S5\&quot;],\n[\&quot;ทดลองแก้ไขแบบสุ่ม\&quot;,\&quot;25\&quot;,\&quot;2\&quot;,\&quot;ได้ข้อมูลบางส่วน\&quot;,\&quot;S3\&quot;],\n[\&quot;รอโดยไม่ดำเนินการ\&quot;,\&quot;5\&quot;,\&quot;2\&quot;,\&quot;เสียเวลา\&quot;,\&quot;S4\&quot;]]},\nS3:{\nstatus:\&quot;ระบบยังไม่เสถียร ทรัพยากรลดลง\&quot;,\nevidence:[\&quot;ข้อมูลยังไม่ครบ\&quot;,\&quot;ต้องเลือกแนวทางใหม่\&quot;],\nactions:[\n[\&quot;กลับมาตรวจสอบหลักฐาน\&quot;,\&quot;10\&quot;,\&quot;1\&quot;,\&quot;ได้ข้อมูลใหม่\&quot;,\&quot;S5\&quot;],\n[\&quot;ใช้ทรัพยากรเพิ่ม\&quot;,\&quot;40\&quot;,\&quot;2\&quot;,\&quot;ระบบดีขึ้นบางส่วน\&quot;,\&quot;S4\&quot;],\n[\&quot;ยกเลิกภารกิจ\&quot;,\&quot;0\&quot;,\&quot;1\&quot;,\&quot;ภารกิจหยุด\&quot;,\&quot;END\&quot;]]},\nS4:{\nstatus:\&quot;ประสิทธิภาพลดลง ต้องประเมินใหม่\&quot;,\nevidence:[\&quot;พบผลกระทบจากการตัดสินใจ\&quot;],\nactions:[\n[\&quot;วางแผนใหม่\&quot;,\&quot;10\&quot;,\&quot;1\&quot;,\&quot;ฟื้นสถานการณ์\&quot;,\&quot;S5\&quot;],\n[\&quot;ดำเนินการต่อโดยไม่วิเคราะห์\&quot;,\&quot;20\&quot;,\&quot;2\&quot;,\&quot;เกิดความเสี่ยง\&quot;,\&quot;END\&quot;],\n[\&quot;ตรวจสอบข้อมูล\&quot;,\&quot;10\&quot;,\&quot;1\&quot;,\&quot;ได้รับข้อมูลเพิ่ม\&quot;,\&quot;S5\&quot;]]},\nS5:{\nstatus:\&quot;พร้อมตัดสินใจแก้ไขระบบ\&quot;,\nevidence:[\&quot;ข้อมูลเพียงพอสำหรับเลือกแนวทาง\&quot;],\nactions:[\n[\&quot;เลือกแนวทางแก้ไขที่เหมาะสม\&quot;,\&quot;10\&quot;,\&quot;1\&quot;,\&quot;ระบบกลับมาทำงาน\&quot;,\&quot;SUCCESS\&quot;],\n[\&quot;ทดลองเพิ่มเติม\&quot;,\&quot;20\&quot;,\&quot;2\&quot;,\&quot;ใช้เวลามากขึ้น\&quot;,\&quot;RETRY\&quot;],\n[\&quot;เลือกจากการคาดเดา\&quot;,\&quot;5\&quot;,\&quot;1\&quot;,\&quot;เกิดความผิดพลาด\&quot;,\&quot;FAIL\&quot;]]}\n};\n\nlet state=\&quot;S1\&quot;,budget=100,turn=1,logs=[];\n\nfunction render(){\nlet s=states[state];\nstatus.innerHTML=s.status;\nevidence.innerHTML=s.evidence.map((item,index)=&gt;(index+1)+\&quot; . \&quot;+item).join(\&quot;&lt;br&gt;\&quot;);\ndocument.getElementById(\&quot;budget\&quot;).innerHTML=budget;\ndocument.getElementById(\&quot;turn\&quot;).innerHTML=turn;\n\nactions.innerHTML=\&quot;\&quot;;\ns.actions.forEach(a=&gt;{\nlet b=document.createElement(\&quot;button\&quot;);\nb.innerHTML=a[0]+\&quot; (Cost \&quot;+a[1]+\&quot;)\&quot;;\nb.onclick=()=&gt;act(a);\nactions.appendChild(b);\n});\n}\n\nfunction act(a){\nbudget-=Number(a[1]);\nturn++;\nlogs.push(\&quot;Turn \&quot;+(turn-1)+\&quot;: \&quot;+a[0]+\&quot; | Cost \&quot;+a[1]+\&quot; | Info: \&quot;+a[3]);\nlog.innerHTML=logs.join(\&quot;&lt;br&gt;\&quot;);\n\nfeedback.innerHTML=a[3];\n\nif(a[4]==\&quot;SUCCESS\&quot;||a[4]==\&quot;FAIL\&quot;||a[4]==\&quot;RETRY\&quot;||a[4]==\&quot;END\&quot;){\nfinish(a[4]);\nreturn;\n}\nstate=a[4];\nrender();\n}\n\nfunction finish(result){\ngame.className=\&quot;hidden\&quot;;\nsummary.className=\&quot;box\&quot;;\nsummary.innerHTML=\&quot;&lt;h2&gt;🎉 Simulation Summary&lt;/h2&gt;\&quot;+\n\&quot;&lt;p&gt;Outcome: \&quot;+result+\&quot;&lt;/p&gt;\&quot;+\n\&quot;&lt;p&gt;Resource Remaining: \&quot;+budget+\&quot;&lt;/p&gt;\&quot;+\n\&quot;&lt;h3&gt;Decision History&lt;/h3&gt;\&quot;+logs.join(\&quot;&lt;br&gt;\&quot;);\n}\n\nrender();\n&lt;/script&gt;\n\n&lt;/div&gt;\n&lt;/body&gt;\n&lt;/html&gt;&quot;></iframe>
</section>

<script>
const titles = ["Robot Builder Mission", "ROBO-Z Classification Lab", "ROBO-Z Crisis Decision Mission", "ROBO-Z System Rescue Escape Mission", "ROBO-Z AI Simulation State Machine"];
function openGame(index){
  document.getElementById("menu").style.display="none";
  document.getElementById("player").style.display="block";
  document.getElementById("current").textContent=titles[index];
  document.querySelectorAll(".game-frame").forEach(f=>f.style.display="none");
  document.getElementById("frame"+index).style.display="block";
  window.scrollTo(0,0);
}
function backToMenu(){
  document.getElementById("player").style.display="none";
  document.getElementById("menu").style.display="block";
  document.querySelectorAll(".game-frame").forEach(f=>f.style.display="none");
  window.scrollTo(0,0);
}
</script>
</body>
</html>
